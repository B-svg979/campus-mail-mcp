name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned runtime and development tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" wheel setuptools
      - name: Check tracked release files
        run: python scripts/check_release.py
      - name: Lint
        run: python -m ruff check src scripts tests platform/src
      - name: Test
        run: python -m pytest -q
      - name: Verify core STDIO without system timezone data
        run: python scripts/selftest_stdio.py --without-system-timezones
      - name: Build both wheels from source
        run: python scripts/build_platform.py
      - name: Install standalone school adapter
        run: python -m pip install --no-deps dist/campus_mail_platform-0.1.3-py3-none-any.whl
      - name: Verify standalone school adapter
        run: python scripts/selftest_stdio.py --platform --without-system-timezones
      - name: Check installed dependencies
        run: python -m pip check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
