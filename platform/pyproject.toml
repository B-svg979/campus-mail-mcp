[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-mail-platform"
version = "0.1.4"
description = "Portable read-only campus email MCP for school-managed uvx"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "beautifulsoup4==4.15.0",
  "pypdf==6.21.4",
  "python-dotenv==1.2.4",
  "tzdata==2026.6",
]

[project.scripts]
campus-mail-platform = "campus_mail_platform.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campus_mail_platform = ["*.whl", "*.sha256"]
