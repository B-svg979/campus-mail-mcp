[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-mail-mcp"
version = "0.1.5"
description = "Read-only campus email MCP with STDIO, authenticated HTTP and network diagnostics"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "exchangelib==5.6.0",
  "beautifulsoup4==4.15.0",
  "pypdf==6.21.4",
  "python-dotenv>=1.2.2,<2",
  "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.17,<1", "cryptography>=43"]

[project.scripts]
campus-mail = "campus_mail_mcp.cli:main"
campus-mail-diagnose = "campus_mail_mcp.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
